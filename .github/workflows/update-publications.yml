# Weekly check for new publications.
#
# Looks up Prof. Gadiyar's papers on OpenAlex and, if any are missing from _data/publications.yml,
# opens a pull request that adds them (with best-guess topic and type) for review. Merging the
# pull request publishes them on the Publications page.
#
# Runs every Monday, and can be started by hand from the Actions tab ("Run workflow").

name: Update publications

on:
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC (8–9 am Eastern)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Look for new publications 🔎
        id: update
        env:
          SUMMARY_FILE: ${{ runner.temp }}/publications-update.md
        run: node .github/scripts/update-publications.mjs
      - name: Open pull request 📬
        if: steps.update.outputs.added != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/update-publications
          delete-branch: true
          add-paths: _data/publications.yml
          commit-message: "Add new publications from OpenAlex"
          title: "New publications found (${{ steps.update.outputs.added }})"
          body-path: ${{ runner.temp }}/publications-update.md
          labels: publications
